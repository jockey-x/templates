apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: alluxio
spec:
  title: 'Alluxio'
  url: 'https://www.alluxio.io/'
  gitRepo: 'https://github.com/Alluxio/alluxio'
  author: 'Sealos'
  description: 'Alluxio is an open source data orchestration platform that provides a virtual distributed file system for analytics and AI workloads.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/alluxio/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/alluxio/logo.png'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Alluxio 是开源数据编排平台，为分析和 AI 工作负载提供虚拟分布式文件系统。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/alluxio/README_zh.md'
  categories:
    - storage
    - backend
  defaults:
    app_name:
      type: string
      value: alluxio-${{ random(8) }}
    app_host:
      type: string
      value: alluxio-${{ random(8) }}
  inputs:
    worker_ramdisk_size:
      description: 'Amount of worker storage managed by Alluxio, such as 512MB or 1GB.'
      type: string
      default: '1GB'
      required: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-config
  labels:
    app: ${{ defaults.app_name }}-config
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-config
data:
  vn-optvn-alluxiovn-confvn-alluxiovn-sitevn-properties: |
    alluxio.master.journal.folder=/journal
    alluxio.master.bind.host=0.0.0.0
    alluxio.master.web.bind.host=0.0.0.0
    alluxio.worker.bind.host=0.0.0.0
    alluxio.worker.web.bind.host=0.0.0.0
    alluxio.worker.data.bind.host=0.0.0.0
    alluxio.user.hostname=localhost

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: quay-kufddygt.sealoshzh.site/u-002/alluxio:2.9.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-permissions
          image: quay-kufddygt.sealoshzh.site/u-002/alluxio:2.9.3
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -e
              mkdir -p /data/alluxio /logs /opt/alluxio/underFSStorage /journal
              chown -R 10004:10004 /data/alluxio /logs /opt/alluxio/underFSStorage /journal
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: vn-datavn-alluxio
              mountPath: /data/alluxio
            - name: vn-logs
              mountPath: /logs
            - name: vn-optvn-alluxiovn-underfsstorage
              mountPath: /opt/alluxio/underFSStorage
            - name: vn-journal
              mountPath: /journal
      containers:
        - name: ${{ defaults.app_name }}
          image: quay-kufddygt.sealoshzh.site/u-002/alluxio:2.9.3
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -e
              mkdir -p "${ALLUXIO_LOGS_DIR}" "${ALLUXIO_WORKER_TIEREDSTORE_LEVEL0_DIRS_PATH}" "${ALLUXIO_UNDERFS_DIR}" /journal
              cp "${ALLUXIO_HOME}/conf/alluxio-site.properties.template" "${ALLUXIO_HOME}/conf/alluxio-site.properties"
              {
                echo "alluxio.master.hostname=${ALLUXIO_MASTER_HOSTNAME}"
                echo "alluxio.master.mount.table.root.ufs=${ALLUXIO_UNDERFS_ADDRESS}"
                echo "alluxio.worker.ramdisk.size=${ALLUXIO_WORKER_RAMDISK_SIZE}"
                echo "alluxio.worker.tieredstore.level0.dirs.path=${ALLUXIO_WORKER_TIEREDSTORE_LEVEL0_DIRS_PATH}"
                echo "alluxio.logs.dir=${ALLUXIO_LOGS_DIR}"
              } >> "${ALLUXIO_HOME}/conf/alluxio-site.properties"
              printf '%s\n' "${ALLUXIO_PROPERTIES}" >> "${ALLUXIO_HOME}/conf/alluxio-site.properties"
              if [ ! -f /journal/.formatted ]; then
                alluxio formatMaster
                touch /journal/.formatted
              fi
              alluxio-start.sh master
              until (echo > /dev/tcp/127.0.0.1/19998) >/dev/null 2>&1; do
                echo waiting for Alluxio master
                sleep 5
              done
              alluxio-start.sh worker NoMount
              stop_alluxio() {
                alluxio-stop.sh worker >/dev/null 2>&1 || true
                alluxio-stop.sh master >/dev/null 2>&1 || true
              }
              trap stop_alluxio TERM INT
              touch "${ALLUXIO_LOGS_DIR}/master.log" "${ALLUXIO_LOGS_DIR}/worker.log"
              tail -F "${ALLUXIO_LOGS_DIR}/master.log" "${ALLUXIO_LOGS_DIR}/worker.log" &
              wait "$!"
          env:
            - name: ALLUXIO_HOME
              value: /opt/alluxio
            - name: ALLUXIO_LOGS_DIR
              value: /logs
            - name: ALLUXIO_UNDERFS_DIR
              value: /opt/alluxio/underFSStorage
            - name: ALLUXIO_UNDERFS_ADDRESS
              value: file:///opt/alluxio/underFSStorage
            - name: ALLUXIO_MASTER_HOSTNAME
              value: ${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            - name: ALLUXIO_WORKER_RAMDISK_SIZE
              value: ${{ inputs.worker_ramdisk_size }}
            - name: ALLUXIO_WORKER_TIEREDSTORE_LEVEL0_DIRS_PATH
              value: /data/alluxio
            - name: ALLUXIO_PROPERTIES
              valueFrom:
                configMapKeyRef:
                  name: ${{ defaults.app_name }}-config
                  key: vn-optvn-alluxiovn-confvn-alluxiovn-sitevn-properties
          ports:
            - name: master-rpc
              containerPort: 19998
              protocol: TCP
            - name: master-ui
              containerPort: 19999
              protocol: TCP
            - name: worker-rpc
              containerPort: 29999
              protocol: TCP
            - name: worker-ui
              containerPort: 30000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: 19999
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 19999
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 19998
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
          securityContext:
            runAsUser: 10004
            runAsGroup: 10004
          volumeMounts:
            - name: vn-datavn-alluxio
              mountPath: /data/alluxio
            - name: vn-logs
              mountPath: /logs
            - name: vn-optvn-alluxiovn-underfsstorage
              mountPath: /opt/alluxio/underFSStorage
            - name: vn-journal
              mountPath: /journal
  volumeClaimTemplates:
    - metadata:
        name: vn-datavn-alluxio
        annotations:
          path: /data/alluxio
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-logs
        annotations:
          path: /logs
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-optvn-alluxiovn-underfsstorage
        annotations:
          path: /opt/alluxio/underFSStorage
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-journal
        annotations:
          path: /journal
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - name: master-rpc
      port: 19998
      targetPort: 19998
      protocol: TCP
    - name: master-ui
      port: 19999
      targetPort: 19999
      protocol: TCP
    - name: worker-rpc
      port: 29999
      targetPort: 29999
      protocol: TCP
    - name: worker-ui
      port: 30000
      targetPort: 30000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 19999
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/alluxio/logo.png'
  name: Alluxio
  type: iframe
