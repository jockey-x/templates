apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: ranger-kms
spec:
  title: 'Apache Ranger KMS'
  url: 'https://ranger.apache.org/'
  gitRepo: 'https://github.com/apache/ranger'
  author: 'Sealos'
  description: 'Apache Ranger KMS is a Hadoop Key Management Server implementation integrated with Apache Ranger security policies.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ranger-kms/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ranger-kms/logo.svg'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Apache Ranger KMS 是集成 Ranger 安全策略的 Hadoop 密钥管理服务实现。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ranger-kms/README_zh.md'
  categories:
    - dev-ops
    - backend
  defaults:
    app_name:
      type: string
      value: ranger-kms-${{ random(8) }}
    app_host:
      type: string
      value: ranger-kms-${{ random(8) }}
  inputs:
    ranger_admin_service:
      description: 'Ranger Admin Service name deployed in the same namespace.'
      type: string
      default: 'ranger'
      required: true
    ranger_admin_password:
      description: 'Ranger Admin password used by both admin and keyadmin accounts from the Ranger Admin template.'
      type: string
      required: true
    master_key_password:
      description: 'Ranger KMS master key password.'
      type: string
      default: 'RangerA1${{ random(8) }}'
      required: true
    use_external_mysql:
      description: 'Use an external MySQL database instead of creating the built-in MySQL database.'
      type: boolean
      default: 'false'
      required: false
    external_mysql_url:
      description: 'External MySQL connection string, for example mysql://user:password@mysql.example.com:3306/rangerkms.'
      type: string
      default: ''
      required: true
      if: inputs.use_external_mysql === 'true'

---
${{ if(inputs.use_external_mysql === 'false') }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
rules:
  - apiGroups:
      - '*'
    resources:
      - '*'
    verbs:
      - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
  name: ${{ defaults.app_name }}-mysql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  labels:
    kb.io/database: ac-mysql-8.0.30-1
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
  name: ${{ defaults.app_name }}-mysql
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30-1
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      name: mysql
      noCreatePDB: false
      replicas: 1
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 512Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []
${{ else() }}

---
apiVersion: v1
kind: Secret
metadata:
  name: ${{ defaults.app_name }}-mysql-conn-credential
  labels:
    app: ${{ defaults.app_name }}-mysql
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mysql
type: Opaque
stringData:
  url: "${{ inputs.external_mysql_url }}"
${{ endif() }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-mysql-init
spec:
  completions: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql-init
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            ${{ if(inputs.use_external_mysql === 'true') }}
            - name: MYSQL_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: url
            ${{ else() }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: DATABASE_NAME
              value: rangerkms
            ${{ endif() }}
          command:
            - /bin/sh
            - -c
            - |
              if [ -n "${MYSQL_URL:-}" ]; then
                mysql_url="${MYSQL_URL#mysql://}"
                if [ "${mysql_url}" = "${MYSQL_URL}" ]; then
                  echo "MYSQL_URL must use mysql://user:password@host:port/database format." >&2
                  exit 1
                fi
                mysql_url="${mysql_url%%\?*}"
                mysql_auth="${mysql_url%@*}"
                mysql_host_db="${mysql_url##*@}"
                if [ "${mysql_auth}" = "${mysql_url}" ] || [ -z "${mysql_auth}" ] || [ "${mysql_host_db}" = "${mysql_url}" ]; then
                  echo "MYSQL_URL must include user, password, host, and database." >&2
                  exit 1
                fi
                if [ "${mysql_auth#*:}" = "${mysql_auth}" ]; then
                  echo "MYSQL_URL must include a password." >&2
                  exit 1
                fi
                MYSQL_USER="${mysql_auth%%:*}"
                MYSQL_PASSWORD="${mysql_auth#*:}"
                mysql_host_port="${mysql_host_db%%/*}"
                DATABASE_NAME="${mysql_host_db#*/}"
                if [ "${DATABASE_NAME}" = "${mysql_host_db}" ] || [ -z "${DATABASE_NAME}" ]; then
                  echo "MYSQL_URL must include a database path." >&2
                  exit 1
                fi
                MYSQL_HOST="${mysql_host_port%%:*}"
                MYSQL_PORT="${mysql_host_port#*:}"
                if [ "${MYSQL_PORT}" = "${MYSQL_HOST}" ]; then
                  MYSQL_PORT=3306
                fi
              fi
              until mysql -h${MYSQL_HOST} -P${MYSQL_PORT} -u${MYSQL_USER} -p${MYSQL_PASSWORD} -e "SELECT 1" >/dev/null 2>&1; do
                echo "MySQL is not ready, retrying..."
                sleep 2
              done
              mysql -h${MYSQL_HOST} -P${MYSQL_PORT} -u${MYSQL_USER} -p${MYSQL_PASSWORD} \
                -e "CREATE DATABASE IF NOT EXISTS \`${DATABASE_NAME}\` DEFAULT CHARACTER SET utf8mb4 DEFAULT COLLATE utf8mb4_unicode_ci;" \
                || mysql -h${MYSQL_HOST} -P${MYSQL_PORT} -u${MYSQL_USER} -p${MYSQL_PASSWORD} "${DATABASE_NAME}" -e "SELECT 1"
      restartPolicy: Never
  backoffLimit: 0
  ttlSecondsAfterFinished: 300

---
apiVersion: v1
kind: ConfigMap
