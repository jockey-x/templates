---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: sealos.hub:5000/u-002/ranger-kms:2.4.0
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-permissions
          image: sealos.hub:5000/u-002/ranger-kms:2.4.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data /logs && chown -R 1000:1000 /data /logs && chmod -R ug+rwX /data /logs
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: vn-data
              mountPath: /data
            - name: vn-logs
              mountPath: /logs
      containers:
        - name: ${{ defaults.app_name }}
          image: sealos.hub:5000/u-002/ranger-kms:2.4.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              : "${RANGER_HOME:=/opt/ranger}"
              : "${RANGER_KMS_HOME:=${RANGER_HOME}/ranger-2.4.0-kms}"
              : "${RANGER_KMS_CONF_DIR:=${RANGER_KMS_HOME}/ews/webapp/WEB-INF/classes/conf}"
              if [ ! -x "${RANGER_KMS_HOME}/setup.sh" ]; then
                echo "Unable to find Ranger KMS home under ${RANGER_KMS_HOME}" >&2
                exit 1
              fi
              export RANGER_HOME RANGER_KMS_HOME RANGER_KMS_CONF_DIR
              export PATH="${RANGER_KMS_HOME}/ews/webapp/WEB-INF/classes/conf:${RANGER_KMS_HOME}/ews/webapp/WEB-INF/lib:${RANGER_KMS_HOME}/ews/lib:${RANGER_KMS_HOME}/bin:${PATH}"
              if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/java" ]; then
                JAVA_BIN="$(command -v java)"
                JAVA_REAL="$(readlink -f "${JAVA_BIN}" 2>/dev/null || realpath "${JAVA_BIN}" 2>/dev/null || echo "${JAVA_BIN}")"
                export JAVA_HOME="$(dirname "$(dirname "${JAVA_REAL}")")"
              fi
              : "${RANGER_KMS_DB_NAME:=rangerkms}"
              if [ -n "${RANGER_KMS_DB_URL:-}" ]; then
                ranger_kms_db_url="${RANGER_KMS_DB_URL#mysql://}"
                if [ "${ranger_kms_db_url}" = "${RANGER_KMS_DB_URL}" ]; then
                  echo "RANGER_KMS_DB_URL must use mysql://user:password@host:port/database format." >&2
                  exit 1
                fi
                ranger_kms_db_url="${ranger_kms_db_url%%\?*}"
                ranger_kms_db_auth="${ranger_kms_db_url%@*}"
                ranger_kms_db_host_db="${ranger_kms_db_url##*@}"
                if [ "${ranger_kms_db_auth}" = "${ranger_kms_db_url}" ] || [ -z "${ranger_kms_db_auth}" ] || [ "${ranger_kms_db_host_db}" = "${ranger_kms_db_url}" ]; then
                  echo "RANGER_KMS_DB_URL must include user, password, host, and database." >&2
                  exit 1
                fi
                if [ "${ranger_kms_db_auth#*:}" = "${ranger_kms_db_auth}" ]; then
                  echo "RANGER_KMS_DB_URL must include a password." >&2
                  exit 1
                fi
                RANGER_KMS_DB_USER="${ranger_kms_db_auth%%:*}"
                RANGER_KMS_DB_PASSWORD="${ranger_kms_db_auth#*:}"
                ranger_kms_db_host_port="${ranger_kms_db_host_db%%/*}"
                RANGER_KMS_DB_NAME="${ranger_kms_db_host_db#*/}"
                if [ "${RANGER_KMS_DB_NAME}" = "${ranger_kms_db_host_db}" ] || [ -z "${RANGER_KMS_DB_NAME}" ]; then
                  echo "RANGER_KMS_DB_URL must include a database path." >&2
                  exit 1
                fi
                RANGER_KMS_DB_HOST="${ranger_kms_db_host_port%%:*}"
                RANGER_KMS_DB_PORT="${ranger_kms_db_host_port#*:}"
                if [ "${RANGER_KMS_DB_PORT}" = "${RANGER_KMS_DB_HOST}" ]; then
                  RANGER_KMS_DB_PORT=3306
                fi
              fi
              mkdir -p "${RANGER_KMS_CONF_DIR}" /data /logs
              until (echo >"/dev/tcp/${RANGER_KMS_DB_HOST}/${RANGER_KMS_DB_PORT}") >/dev/null 2>&1; do
                echo waiting for ranger kms database
                sleep 5
              done
              until (echo >"/dev/tcp/${RANGER_ADMIN_SERVICE}.${RANGER_KMS_NAMESPACE}.svc.cluster.local/6080") >/dev/null 2>&1; do
                echo waiting for ranger admin
                sleep 5
              done
              cp /mounted-conf/install.properties /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_DB_USER}#${RANGER_KMS_DB_USER}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_DB_PASSWORD}#${RANGER_KMS_DB_PASSWORD}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_DB_HOST}#${RANGER_KMS_DB_HOST}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_DB_PORT}#${RANGER_KMS_DB_PORT}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_DB_NAME}#${RANGER_KMS_DB_NAME}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_ADMIN_SERVICE}#${RANGER_ADMIN_SERVICE}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_NAMESPACE}#${RANGER_KMS_NAMESPACE}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_SERVICE}#${RANGER_KMS_SERVICE}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_MASTER_KEY_PASS}#${RANGER_KMS_MASTER_KEY_PASS}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_HOME}#${RANGER_KMS_HOME}#g" /tmp/ranger-kms-install-overrides.properties
              sed -i "s#\${RANGER_KMS_BIND_HOST}#${RANGER_KMS_BIND_HOST}#g" /tmp/ranger-kms-install-overrides.properties
              awk -F= '
                NR==FNR {
                  if ($0 ~ /^[[:space:]]*#/ || $0 ~ /^[[:space:]]*$/) next
                  key=$1
                  overrides[key]=$0
                  next
                }
                {
                  split($0, parts, "=")
                  key=parts[1]
                  if (key in overrides) {
                    print overrides[key]
                    seen[key]=1
                  } else {
                    print
                  }
                }
                END {
                  for (key in overrides) {
                    if (!(key in seen)) print overrides[key]
                  }
                }
              ' /tmp/ranger-kms-install-overrides.properties "${RANGER_KMS_HOME}/install.properties" > /tmp/ranger-kms-install.properties
              mv /tmp/ranger-kms-install.properties "${RANGER_KMS_HOME}/install.properties"
              cp /mounted-conf/dbks-site.xml "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_ADMIN_SERVICE}#${RANGER_ADMIN_SERVICE}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_KMS_NAMESPACE}#${RANGER_KMS_NAMESPACE}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_KMS_HOME}#${RANGER_KMS_HOME}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_KMS_BIND_HOST}#${RANGER_KMS_BIND_HOST}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_KMS_DB_HOST}#${RANGER_KMS_DB_HOST}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_KMS_DB_PORT}#${RANGER_KMS_DB_PORT}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_KMS_DB_NAME}#${RANGER_KMS_DB_NAME}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              sed -i "s#\${RANGER_KMS_DB_USER}#${RANGER_KMS_DB_USER}#g" "${RANGER_KMS_CONF_DIR}/dbks-site.xml"
              cp /mounted-conf/ranger-kms-site.xml "${RANGER_KMS_CONF_DIR}/ranger-kms-site.xml"
              sed -i "s#\${RANGER_ADMIN_SERVICE}#${RANGER_ADMIN_SERVICE}#g" "${RANGER_KMS_CONF_DIR}/ranger-kms-site.xml"
              sed -i "s#\${RANGER_KMS_NAMESPACE}#${RANGER_KMS_NAMESPACE}#g" "${RANGER_KMS_CONF_DIR}/ranger-kms-site.xml"
              sed -i "s#\${RANGER_KMS_HOME}#${RANGER_KMS_HOME}#g" "${RANGER_KMS_CONF_DIR}/ranger-kms-site.xml"
              sed -i "s#\${RANGER_KMS_BIND_HOST}#${RANGER_KMS_BIND_HOST}#g" "${RANGER_KMS_CONF_DIR}/ranger-kms-site.xml"
              cp /mounted-conf/kms-site.xml "${RANGER_KMS_CONF_DIR}/kms-site.xml"
              sed -i "s#\${RANGER_ADMIN_SERVICE}#${RANGER_ADMIN_SERVICE}#g" "${RANGER_KMS_CONF_DIR}/kms-site.xml"
              sed -i "s#\${RANGER_KMS_NAMESPACE}#${RANGER_KMS_NAMESPACE}#g" "${RANGER_KMS_CONF_DIR}/kms-site.xml"
              sed -i "s#\${RANGER_KMS_HOME}#${RANGER_KMS_HOME}#g" "${RANGER_KMS_CONF_DIR}/kms-site.xml"
              sed -i "s#\${RANGER_KMS_BIND_HOST}#${RANGER_KMS_BIND_HOST}#g" "${RANGER_KMS_CONF_DIR}/kms-site.xml"
              cp /mounted-conf/kms-logback.xml "${RANGER_KMS_CONF_DIR}/kms-logback.xml"
              export RANGER_KMS_STORE_JDBC="jdbc:mysql://${RANGER_KMS_DB_HOST}:${RANGER_KMS_DB_PORT}/${RANGER_KMS_DB_NAME}"
              export RANGER_KMS_STORE_USER="${RANGER_KMS_DB_USER}"
              export RANGER_KMS_STORE_PASS="${RANGER_KMS_DB_PASSWORD}"
              export RANGER_KMS_STORE_JDBC RANGER_KMS_STORE_USER RANGER_KMS_STORE_PASS RANGER_KMS_MASTER_KEY_PASS RANGER_KMS_DB_NAME
              export LOGFILE=/logs/ranger-kms-setup.log
              touch "${LOGFILE}"
              exec /opt/entrypoint.sh
          env:
            - name: RANGER_HOME
              value: /opt/ranger
            - name: RANGER_KMS_HOME
              value: /opt/ranger/ranger-2.4.0-kms
            - name: RANGER_KMS_CONF_DIR
              value: /opt/ranger/ranger-2.4.0-kms/ews/webapp/WEB-INF/classes/conf
            - name: RANGER_ADMIN_SERVICE
              value: ${{ inputs.ranger_admin_service }}
            - name: RANGER_KMS_SERVICE
              value: ${{ defaults.app_name }}
            - name: RANGER_KMS_NAMESPACE
              value: ${{ SEALOS_NAMESPACE }}
            - name: RANGER_KMS_BIND_HOST
              value: 0.0.0.0
            ${{ if(inputs.use_external_mysql === 'true') }}
            - name: RANGER_KMS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: url
            ${{ else() }}
            - name: RANGER_KMS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: RANGER_KMS_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: RANGER_KMS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: RANGER_KMS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: RANGER_KMS_DB_NAME
              value: rangerkms
            ${{ endif() }}
            - name: RANGER_KMS_MASTER_KEY_PASS
              value: ${{ inputs.master_key_password }}
            - name: RANGER_KMS_OPTS
              value: -Xms256m -Xmx768m
          ports:
            - name: http
              containerPort: 9292
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 9292
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 9292
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9292
            initialDelaySeconds: 240
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: vn-mountedvn-conf
              mountPath: /mounted-conf
            - name: vn-data
              mountPath: /data
            - name: vn-logs
              mountPath: /logs
      volumes:
        - name: vn-mountedvn-conf
          configMap:
            name: ${{ defaults.app_name }}-config
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-logs
        annotations:
          path: /logs
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9292
      targetPort: 9292
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-register
  labels:
    app: ${{ defaults.app_name }}-register
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-register
spec:
  completions: 1
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ranger-kms-register
          image: sealos.hub:5000/u-002/ranger-kms:2.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: RANGER_ADMIN_SERVICE
              value: ${{ inputs.ranger_admin_service }}
            - name: RANGER_ADMIN_NAMESPACE
              value: ${{ SEALOS_NAMESPACE }}
            - name: RANGER_ADMIN_PASSWORD
              value: ${{ inputs.ranger_admin_password }}
            - name: RANGER_KMS_SERVICE
              value: ${{ defaults.app_name }}
            - name: RANGER_KMS_NAMESPACE
              value: ${{ SEALOS_NAMESPACE }}
          command:
            - sh
            - -c
            - |
              set -eu
              python3 - <<'PY'
              import base64
              import json
              import os
              import sys
              import time
              import urllib.error
              import urllib.request

              admin_url = "http://{svc}.{ns}.svc.cluster.local:6080".format(
                  svc=os.environ["RANGER_ADMIN_SERVICE"],
                  ns=os.environ["RANGER_ADMIN_NAMESPACE"],
              )
              kms_service = os.environ["RANGER_KMS_SERVICE"]
              kms_namespace = os.environ["RANGER_KMS_NAMESPACE"]
              kms_url = "http://{svc}.{ns}.svc.cluster.local:9292/kms/v1/".format(
                  svc=kms_service,
                  ns=kms_namespace,
              )
              provider_url = "kms://http@{svc}.{ns}.svc.cluster.local:9292/kms".format(
                  svc=kms_service,
                  ns=kms_namespace,
              )
              ranger_admin_password = os.environ["RANGER_ADMIN_PASSWORD"]

              def auth_header(username):
                  return "Basic " + base64.b64encode(
                      (username + ":" + ranger_admin_password).encode("utf-8")
                  ).decode("ascii")

              def http_request(url, method="GET", payload=None, auth_user=None, timeout=10):
                  data = None
                  headers = {}
                  if payload is not None:
                      data = json.dumps(payload).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  if auth_user:
                      headers["Authorization"] = auth_header(auth_user)
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as resp:
                          return resp.status, resp.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as exc:
                      return exc.code, exc.read().decode("utf-8", "replace")
                  except Exception as exc:
                      return 0, str(exc)

              for _ in range(120):
                  status, body = http_request(
                      admin_url + "/service/public/v2/api/servicedef/name/kms",
                      auth_user="keyadmin",
                      timeout=5,
                  )
                  if status == 200:
                      try:
                          if json.loads(body).get("name") == "kms":
                              break
                      except Exception:
                          pass
                  print("waiting for Ranger Admin KMS service definition: status={}".format(status), flush=True)
                  time.sleep(10)
              else:
                  print("Ranger Admin KMS service definition is not available", file=sys.stderr)
                  sys.exit(1)

              def ensure_ranger_user(username):
                  user_url = admin_url + "/service/xusers/users/userName/" + username
                  status, _ = http_request(user_url, auth_user="admin", timeout=10)
                  if status == 200:
                      print("Ranger user {} already exists".format(username), flush=True)
                      return
                  payload = {
                      "name": username,
                      "firstName": username,
                      "lastName": "",
                      "password": ranger_admin_password,
                      "description": "Default service user required by Ranger KMS policies",
                      "status": 1,
                      "isVisible": 1,
                      "userRoleList": ["ROLE_USER"],
                  }
                  status, body = http_request(
                      admin_url + "/service/xusers/users",
                      method="POST",
                      payload=payload,
                      auth_user="admin",
                      timeout=30,
                  )
                  if status in (200, 201):
                      print("Created Ranger user {}".format(username), flush=True)
                      return
                  status_after, _ = http_request(user_url, auth_user="admin", timeout=10)
                  if status_after == 200:
                      print("Ranger user {} already exists".format(username), flush=True)
                      return
                  print("Failed to create Ranger user {}: {}".format(username, body), file=sys.stderr)
                  sys.exit(1)

              for service_user in ("hdfs", "om", "hive", "hbase"):
                  ensure_ranger_user(service_user)

              for _ in range(120):
                  status, _ = http_request(kms_url, timeout=5)
                  if status in (200, 401, 403):
                      break
                  print("waiting for Ranger KMS endpoint: status={}".format(status), flush=True)
                  time.sleep(10)
              else:
                  print("Ranger KMS endpoint is not available", file=sys.stderr)
                  sys.exit(1)

              service_url = admin_url + "/service/public/v2/api/service/name/" + kms_service
              status, body = http_request(service_url, auth_user="keyadmin", timeout=10)
              if status == 200:
                  try:
                      if json.loads(body).get("name") == kms_service:
                          print("Ranger KMS service {} already exists".format(kms_service))
                          sys.exit(0)
                  except Exception:
                      pass

              payload = {
                  "name": kms_service,
                  "type": "kms",
                  "description": "Apache Ranger KMS service " + kms_service,
                  "isEnabled": True,
                  "configs": {
                      "provider": provider_url,
                      "username": "keyadmin",
                      "password": ranger_admin_password,
                  },
              }
              status, body = http_request(
                  admin_url + "/service/public/v2/api/service",
                  method="POST",
                  payload=payload,
                  auth_user="keyadmin",
                  timeout=30,
              )
              if status not in (200, 201):
                  print(body, file=sys.stderr)
                  sys.exit(1)
              print("Registered Ranger KMS service {} with provider {}".format(kms_service, provider_url))
              PY
      restartPolicy: Never
  backoffLimit: 6
  ttlSecondsAfterFinished: 300

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 9292
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}-cert

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/ranger-kms/logo.svg'
  name: Apache Ranger KMS
  type: link
