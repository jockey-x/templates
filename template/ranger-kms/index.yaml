      </appender>
      <appender name="kms-audit" class="ch.qos.logback.core.rolling.RollingFileAppender">
        <Append>true</Append>
        <File>${kms.log.dir}/kms-audit-${hostname}-${user}.log</File>
        <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
