      </property>
      <property>
        <name>ranger.service.https.port</name>
        <value>9393</value>
      </property>
      <property>
        <name>ranger.service.https.attrib.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>ajp.enabled</name>
        <value>false</value>
      </property>
      <property>
