        <name>ranger.service.shutdown.port</name>
        <value>7085</value>
      </property>
      <property>
        <name>ranger.service.shutdown.command</name>
        <value>SHUTDOWN</value>
      </property>
      <property>
        <name>ranger.contextName</name>
        <value>/kms</value>
