apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: kimai
spec:
  title: "Kimai"
  url: "https://www.kimai.org/"
  gitRepo: "https://github.com/kimai/kimai"
  author: "Sealos"
  description: "An open source time tracking application for teams, projects, activities, invoices, and reporting."
  readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/kimai/README.md"
  icon: "https://www.kimai.org/images/kimai_logo_48.webp"
  templateType: inline
  locale: en
  i18n:
    zh:
      description: "Kimai 是一个开源时间跟踪应用，适用于团队、项目、活动、发票和工时报表管理。"
      readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/kimai/README_zh.md"
  categories:
    - tool
  defaults:
    app_name:
      type: string
      value: kimai-${{ random(8) }}
    app_host:
      type: string
      value: kimai-${{ random(8) }}
    app_secret:
      type: string
      value: ${{ random(64) }}
    admin_password:
      type: string
      value: ${{ random(16) }}
  inputs:

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/instance: ${{ defaults.app_name }}-mysql
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-mysql
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-mysql

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-mysql
  labels:
    kb.io/database: ac-mysql-8.0.30-1
    clusterdefinition.kubeblocks.io/name: apecloud-mysql
    clusterversion.kubeblocks.io/name: ac-mysql-8.0.30-1
spec:
  affinity:
    nodeLabels: {}
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: apecloud-mysql
  clusterVersionRef: ac-mysql-8.0.30-1
  componentSpecs:
    - componentDefRef: mysql
      monitor: true
      name: mysql
      noCreatePDB: false
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 25Mi
      serviceAccountName: ${{ defaults.app_name }}-mysql
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete
  tolerations: []

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-mysql-init
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0.30
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              MYSQL_SERVICE="${{ defaults.app_name }}-mysql-mysql.${{ SEALOS_NAMESPACE }}.svc"
              for i in $(seq 1 180); do
                if [ -s /var/run/sealos-mysql/password ] && mysqladmin ping -h "${MYSQL_SERVICE}" -P 3306 -u root -p"$(cat /var/run/sealos-mysql/password)" --silent; then
                  exit 0
                fi
                sleep 2
              done
              test -s /var/run/sealos-mysql/password
              mysqladmin ping -h "${MYSQL_SERVICE}" -P 3306 -u root -p"$(cat /var/run/sealos-mysql/password)" --silent
          volumeMounts:
            - name: mysql-conn-credential
              mountPath: /var/run/sealos-mysql
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      volumes:
        - name: mysql-conn-credential
          secret:
            secretName: ${{ defaults.app_name }}-mysql-conn-credential
            optional: true
      containers:
        - name: mysql-init
          image: mysql:8.0.30
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: MYSQL_DATABASE
              value: kimai
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if mysqladmin ping -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u "${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent; then
                  break
                fi
                sleep 2
              done
              mysqladmin ping -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u "${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent
              mysql -h "${MYSQL_HOST}" -P "${MYSQL_PORT}" -u "${MYSQL_USER}" -p"${MYSQL_PASSWORD}" -e "CREATE DATABASE IF NOT EXISTS \`${MYSQL_DATABASE}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: kimai/kimai2:2.61.0
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  serviceName: ${{ defaults.app_name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0.30
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              MYSQL_SERVICE="${{ defaults.app_name }}-mysql-mysql.${{ SEALOS_NAMESPACE }}.svc"
              for i in $(seq 1 180); do
                if [ -s /var/run/sealos-mysql/password ] && mysqladmin ping -h "${MYSQL_SERVICE}" -P 3306 -u root -p"$(cat /var/run/sealos-mysql/password)" --silent; then
                  exit 0
                fi
                sleep 2
              done
              test -s /var/run/sealos-mysql/password
              mysqladmin ping -h "${MYSQL_SERVICE}" -P 3306 -u root -p"$(cat /var/run/sealos-mysql/password)" --silent
          volumeMounts:
            - name: mysql-conn-credential
              mountPath: /var/run/sealos-mysql
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      volumes:
        - name: mysql-conn-credential
          secret:
            secretName: ${{ defaults.app_name }}-mysql-conn-credential
            optional: true
      containers:
        - name: ${{ defaults.app_name }}
          image: kimai/kimai2:2.61.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: DATABASE_URL
              value: "mysql://$(MYSQL_USER):$(MYSQL_PASSWORD)@$(MYSQL_HOST):$(MYSQL_PORT)/kimai?charset=utf8mb4&serverVersion=8.0.30"
            - name: APP_ENV
              value: prod
            - name: APP_SECRET
              value: "${{ defaults.app_secret }}"
            - name: TRUSTED_HOSTS
              value: "^(${{ defaults.app_host }}\\.${{ SEALOS_CLOUD_DOMAIN }}|localhost|127\\.0\\.0\\.1|10\\..*)$"
            - name: TRUSTED_PROXIES
              value: "nginx,localhost,127.0.0.1"
            - name: ADMINMAIL
              value: "admin@example.com"
            - name: ADMINPASS
              value: "${{ defaults.admin_password }}"
            - name: MAILER_FROM
              value: "kimai@example.com"
            - name: MAILER_URL
              value: "null://localhost"
            - name: memory_limit
              value: "512M"
          ports:
            - name: http
              containerPort: 8001
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /
              port: 8001
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: vn-optvn-kimaivn-varvn-data
              mountPath: /opt/kimai/var/data
            - name: vn-optvn-kimaivn-varvn-plugins
              mountPath: /opt/kimai/var/plugins
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: vn-optvn-kimaivn-varvn-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup
    - metadata:
        name: vn-optvn-kimaivn-varvn-plugins
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8001
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://www.kimai.org/images/kimai_logo_48.webp"
  name: Kimai
  type: link
