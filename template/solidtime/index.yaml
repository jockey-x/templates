apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: solidtime
spec:
  title: "Solidtime"
  url: "https://www.solidtime.io/"
  gitRepo: "https://github.com/solidtime-io/solidtime"
  author: "Sealos"
  description: "A modern open source time tracking application for freelancers, agencies, projects, reports, and team collaboration."
  readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/solidtime/README.md"
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/solidtime/logo.png"
  templateType: inline
  locale: en
  i18n:
    zh:
      description: "Solidtime 是一个现代化开源时间跟踪应用，适用于自由职业者、团队、项目、报表和工时协作管理。"
      readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/solidtime/README_zh.md"
  categories:
    - tool
  defaults:
    app_name:
      type: string
      value: solidtime-${{ random(8) }}
    app_host:
      type: string
      value: solidtime-${{ random(8) }}
    app_key:
      type: string
      value: ${{ random(32) }}
  inputs:
    admin_email:
      description: "Initial administrator email address"
      type: string
      default: "admin@example.com"
      required: true
    admin_password:
      description: "Initial administrator password"
      type: string
      default: ""
      required: true
    admin_name:
      description: "Initial administrator display name"
      type: string
      default: "Administrator"
      required: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-14.8.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-14.8.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-14.8.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 25Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              PG_SERVICE="${{ defaults.app_name }}-pg-postgresql.${{ SEALOS_NAMESPACE }}.svc"
              for i in $(seq 1 180); do
                if [ -s /var/run/sealos-postgres/password ] && pg_isready -h "${PG_SERVICE}" -p 5432 >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              test -s /var/run/sealos-postgres/password
              pg_isready -h "${PG_SERVICE}" -p 5432
          volumeMounts:
            - name: pg-conn-credential
              mountPath: /var/run/sealos-postgres
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      volumes:
        - name: pg-conn-credential
          secret:
            secretName: ${{ defaults.app_name }}-pg-conn-credential
            optional: true
      containers:
        - name: pgsql-init
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: solidtime
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U postgres -d postgres >/dev/null 2>&1
              if ! psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='${PG_DATABASE}'" | grep -q 1; then
                psql "postgresql://postgres:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${PG_DATABASE}\";"
              fi
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-gotenberg
  annotations:
    originImageName: gotenberg/gotenberg:8.34.0
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-gotenberg
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gotenberg
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-gotenberg
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-gotenberg
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-gotenberg
          image: gotenberg/gotenberg:8.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-gotenberg
  labels:
    app: ${{ defaults.app_name }}-gotenberg
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-gotenberg
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-gotenberg

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: solidtime/solidtime:0.15.1
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  serviceName: ${{ defaults.app_name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              PG_SERVICE="${{ defaults.app_name }}-pg-postgresql.${{ SEALOS_NAMESPACE }}.svc"
              for i in $(seq 1 180); do
                if [ -s /var/run/sealos-postgres/password ] && pg_isready -h "${PG_SERVICE}" -p 5432 >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              test -s /var/run/sealos-postgres/password
              pg_isready -h "${PG_SERVICE}" -p 5432
          volumeMounts:
            - name: pg-conn-credential
              mountPath: /var/run/sealos-postgres
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
        - name: prepare-storage
          image: solidtime/solidtime:0.15.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p \
                /var/www/html/storage/app/public \
                /var/www/html/storage/framework/cache/data \
                /var/www/html/storage/framework/sessions \
                /var/www/html/storage/framework/testing \
                /var/www/html/storage/framework/views \
                /var/www/html/storage/logs
          volumeMounts:
            - name: vn-varvn-wwwvn-htmlvn-storage
              mountPath: /var/www/html/storage
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
        - name: bootstrap-admin
          image: solidtime/solidtime:0.15.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ ! -s storage/oauth-private.key ] || [ ! -s storage/oauth-public.key ]; then
                php artisan passport:keys --force
              fi
              chmod 0600 storage/oauth-private.key storage/oauth-public.key 2>/dev/null || true
              php artisan migrate --force
              set +e
              output="$(printf '%s\n' "${ADMIN_PASSWORD}" | php artisan admin:user:create "${ADMIN_NAME}" "${ADMIN_EMAIL}" --ask-for-password --verify-email 2>&1)"
              status="$?"
              set -e
              printf '%s\n' "${output}"
              if [ "${status}" -ne 0 ]; then
                printf '%s\n' "${output}" | grep -q 'already exists' || exit "${status}"
                php artisan tinker --execute='
                  $user = \App\Models\User::query()
                      ->where("email", getenv("ADMIN_EMAIL"))
                      ->where("is_placeholder", false)
                      ->firstOrFail();
                  $user->forceFill([
                      "password" => \Illuminate\Support\Facades\Hash::make(getenv("ADMIN_PASSWORD")),
                      "email_verified_at" => $user->email_verified_at ?: now(),
                  ])->save();
                  app(\App\Service\UserService::class)->makeSureUserHasAtLeastOneOrganization($user);
                  $user->refresh();
                  app(\App\Service\UserService::class)->makeSureUserHasCurrentOrganization($user);
                '
              fi
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: APP_NAME
              value: "solidtime"
            - name: VITE_APP_NAME
              value: "solidtime"
            - name: APP_VERSION
              value: "0.15.1"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_KEY
              value: "${{ defaults.app_key }}"
            - name: APP_URL
              value: "https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"
            - name: APP_FORCE_HTTPS
              value: "true"
            - name: APP_ENABLE_REGISTRATION
              value: "false"
            - name: APP_LOCAL_EMAIL_VERIFICATION
              value: "false"
            - name: TRUSTED_PROXIES
              value: "0.0.0.0/0,2000:0:0:0:0:0:0:0/3"
            - name: SUPER_ADMINS
              value: "${{ inputs.admin_email }}"
            - name: DB_CONNECTION
              value: "pgsql"
            - name: DB_DATABASE
              value: "solidtime"
            - name: DB_SSLMODE
              value: "prefer"
            - name: SESSION_DRIVER
              value: "database"
            - name: QUEUE_CONNECTION
              value: "sync"
            - name: CACHE_DRIVER
              value: "file"
            - name: BROADCAST_DRIVER
              value: "null"
            - name: FILESYSTEM_DISK
              value: "local"
            - name: PUBLIC_FILESYSTEM_DISK
              value: "public"
            - name: ADMIN_EMAIL
              value: "${{ inputs.admin_email }}"
            - name: ADMIN_PASSWORD
              value: ${{ inputs.admin_password }}
            - name: ADMIN_NAME
              value: "${{ inputs.admin_name }}"
          volumeMounts:
            - name: vn-varvn-wwwvn-htmlvn-storage
              mountPath: /var/www/html/storage
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: pg-conn-credential
          secret:
            secretName: ${{ defaults.app_name }}-pg-conn-credential
            optional: true
      containers:
        - name: ${{ defaults.app_name }}
          image: solidtime/solidtime:0.15.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: APP_NAME
              value: "solidtime"
            - name: VITE_APP_NAME
              value: "solidtime"
            - name: APP_VERSION
              value: "0.15.1"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_KEY
              value: "${{ defaults.app_key }}"
            - name: APP_URL
              value: "https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"
            - name: APP_FORCE_HTTPS
              value: "true"
            - name: APP_ENABLE_REGISTRATION
              value: "false"
            - name: APP_LOCAL_EMAIL_VERIFICATION
              value: "false"
            - name: TRUSTED_PROXIES
              value: "0.0.0.0/0,2000:0:0:0:0:0:0:0/3"
            - name: SUPER_ADMINS
              value: "${{ inputs.admin_email }}"
            - name: PAGINATION_PER_PAGE_DEFAULT
              value: "500"
            - name: LOG_CHANNEL
              value: "stderr_daily"
            - name: LOG_DEPRECATIONS_CHANNEL
              value: "null"
            - name: LOG_LEVEL
              value: "debug"
            - name: DB_CONNECTION
              value: "pgsql"
            - name: DB_DATABASE
              value: "solidtime"
            - name: DB_SSLMODE
              value: "prefer"
            - name: SESSION_DRIVER
              value: "database"
            - name: QUEUE_CONNECTION
              value: "sync"
            - name: CACHE_DRIVER
              value: "file"
            - name: BROADCAST_DRIVER
              value: "null"
            - name: FILESYSTEM_DISK
              value: "local"
            - name: PUBLIC_FILESYSTEM_DISK
              value: "public"
            - name: GOTENBERG_URL
              value: "http://${{ defaults.app_name }}-gotenberg.${{ SEALOS_NAMESPACE }}.svc.cluster.local:3000"
            - name: MAIL_MAILER
              value: "log"
            - name: MAIL_FROM_ADDRESS
              value: "no-reply@${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"
            - name: MAIL_FROM_NAME
              value: "solidtime"
            - name: MAIL_REPLY_TO_ADDRESS
              value: "no-reply@${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"
            - name: MAIL_REPLY_TO_NAME
              value: "solidtime"
            - name: OCTANE_SERVER
              value: "frankenphp"
            - name: CONTAINER_MODE
              value: "http"
            - name: AUTO_DB_MIGRATE
              value: "true"
            - name: WITH_SCHEDULER
              value: "true"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health-check/up
              port: http
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health-check/up
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health-check/up
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: vn-varvn-wwwvn-htmlvn-storage
              mountPath: /var/www/html/storage
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-wwwvn-htmlvn-storage
        annotations:
          path: /var/www/html/storage
          value: "1"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: "https://avatars.githubusercontent.com/u/156823565?s=48&v=4"
  name: "Solidtime"
  type: link
