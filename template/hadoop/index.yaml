metadata:
  name: ${{ defaults.app_name }}-datanode
  annotations:
    originImageName: quay-kufddygt.sealoshzh.site/u-002/hadoop:3.3.6
    deploy.cloud.sealos.io/minReplicas: '${{ inputs.datanode_replicas }}'
    deploy.cloud.sealos.io/maxReplicas: '${{ inputs.datanode_replicas }}'
  labels:
    app: ${{ defaults.app_name }}-datanode
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-datanode
spec:
  replicas: ${{ inputs.datanode_replicas }}
  revisionHistoryLimit: 1
  minReadySeconds: 10
  serviceName: ${{ defaults.app_name }}-datanode
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-datanode
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-datanode
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: init-permissions
          image: quay-kufddygt.sealoshzh.site/u-002/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /data /logs && chown -R hadoop:hadoop /data /logs
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: vn-data
              mountPath: /data
            - name: vn-logs
              mountPath: /logs
      containers:
        - name: ${{ defaults.app_name }}-datanode
          image: quay-kufddygt.sealoshzh.site/u-002/hadoop:3.3.6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              namenode_host="${{ defaults.app_name }}-namenode.${{ SEALOS_NAMESPACE }}.svc.cluster.local"
              until (echo >"/dev/tcp/${namenode_host}/8020") >/dev/null 2>&1; do
                echo waiting for namenode
                sleep 5
              done
              mkdir -p "${HADOOP_CONF_DIR}" "${HADOOP_LOG_DIR}" "${HADOOP_PID_DIR}" "${HADOOP_DATA_DIR}/dfs/data" "${HADOOP_DATA_DIR}/tmp"
              if [ -z "${JAVA_HOME:-}" ] || [ ! -x "${JAVA_HOME}/bin/java" ]; then
                JAVA_BIN="$(command -v java)"
                JAVA_REAL="$(readlink -f "${JAVA_BIN}" 2>/dev/null || echo "${JAVA_BIN}")"
                export JAVA_HOME="$(dirname "$(dirname "${JAVA_REAL}")")"
              fi
              printf '%s\n' "export JAVA_HOME=${JAVA_HOME}" > "${HADOOP_CONF_DIR}/hadoop-env.sh"
              printf '%s\n' "export HADOOP_LOG_DIR=${HADOOP_LOG_DIR}" >> "${HADOOP_CONF_DIR}/hadoop-env.sh"
              printf '%s\n' "export HADOOP_PID_DIR=${HADOOP_PID_DIR}" >> "${HADOOP_CONF_DIR}/hadoop-env.sh"
              cp /mounted-conf/core-site.xml "${HADOOP_CONF_DIR}/core-site.xml"
              cp /mounted-conf/hdfs-site.xml "${HADOOP_CONF_DIR}/hdfs-site.xml"
              cp /mounted-conf/mapred-site.xml "${HADOOP_CONF_DIR}/mapred-site.xml"
              cp /mounted-conf/yarn-site.xml "${HADOOP_CONF_DIR}/yarn-site.xml"
              cp /mounted-conf/workers "${HADOOP_CONF_DIR}/workers"
              hdfs --daemon start datanode
              trap 'hdfs --daemon stop datanode; exit 0' TERM INT
              touch "${HADOOP_LOG_DIR}/datanode.log"
              tail -F "${HADOOP_LOG_DIR}"/*.log &
              wait $!
          env:
            - name: HADOOP_HOME
              value: /opt/hadoop
            - name: HADOOP_CONF_DIR
              value: /etc/hadoop
            - name: HADOOP_LOG_DIR
              value: /logs
            - name: HADOOP_PID_DIR
              value: /tmp/hadoop-pids
            - name: HADOOP_DATA_DIR
              value: /data
            - name: HADOOP_OPTS
              value: -Djava.net.preferIPv4Stack=true
            - name: HDFS_DATANODE_OPTS
              value: -Djava.net.preferIPv4Stack=true
          ports:
            - name: datanode-ui
              containerPort: 9864
              protocol: TCP
            - name: datanode-xfer
              containerPort: 9866
              protocol: TCP
            - name: datanode-ipc
              containerPort: 9867
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: 9864
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 9864
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 9864
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: vn-mountedvn-conf
              mountPath: /mounted-conf
            - name: vn-data
              mountPath: /data
            - name: vn-logs
              mountPath: /logs
      volumes:
        - name: vn-mountedvn-conf
          configMap:
            name: ${{ defaults.app_name }}-config
  volumeClaimTemplates:
    - metadata:
        name: vn-data
        annotations:
          path: /data
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: vn-logs
        annotations:
          path: /logs
          value: '1'
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

