---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-metastore
  annotations:
    originImageName: quay-kufddygt.sealoshzh.site/u-002/hive:3.1.3
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}-metastore
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-metastore
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-metastore
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-metastore
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}-metastore
          image: quay-kufddygt.sealoshzh.site/u-002/hive:3.1.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /mounted-conf/vn-usrvn-localvn-binvn-startvn-metastorevn-sh
          env:
            - name: SERVICE_NAME
              value: metastore
            - name: INIT_HDFS_TEZ
              value: 'false'
            - name: HIVE_HOME
              value: /opt/hive
            - name: HADOOP_HOME
              value: /opt/hadoop
            - name: TEZ_HOME
              value: /opt/tez
            - name: HADOOP_USER_NAME
              value: hadoop
            - name: HIVE_NAMESPACE
              value: ${{ SEALOS_NAMESPACE }}
            - name: HIVE_METASTORE_SERVICE
              value: ${{ defaults.app_name }}-metastore
            ${{ if(inputs.use_external_mysql === 'true') }}
            - name: HIVE_METASTORE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: url
            ${{ else() }}
            - name: HIVE_METASTORE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: password
            - name: HIVE_METASTORE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: host
            - name: HIVE_METASTORE_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: port
            - name: HIVE_METASTORE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-mysql-conn-credential
                  key: username
            - name: HIVE_METASTORE_DB_NAME
              value: hive_metastore
            ${{ endif() }}
          ports:
            - name: metastore
              containerPort: 9083
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9083
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: vn-mountedvn-conf
              mountPath: /mounted-conf
            - name: vn-hadoopvn-conf
              mountPath: /hadoop-conf
      volumes:
        - name: vn-mountedvn-conf
          configMap:
            name: ${{ defaults.app_name }}-config
        - name: vn-hadoopvn-conf
          configMap:
            name: ${{ inputs.hadoop_configmap_name }}

---
