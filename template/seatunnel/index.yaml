apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: seatunnel
spec:
  title: 'Apache SeaTunnel'
  url: 'https://seatunnel.apache.org/'
  gitRepo: 'https://github.com/apache/seatunnel'
  author: 'Sealos'
  description: 'Apache SeaTunnel is a distributed, high-performance data integration platform for synchronizing and transforming large-scale data.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/seatunnel/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/seatunnel/logo.png'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'Apache SeaTunnel 是一个分布式高性能数据集成平台，用于大规模数据同步与转换。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/seatunnel/README_zh.md'
  categories:
    - backend
    - dev-ops
  defaults:
    app_name:
      type: string
      value: seatunnel-${{ random(8) }}
    app_host:
      type: string
      value: seatunnel-${{ random(8) }}
  inputs:
    worker_replicas:
      description: 'Number of SeaTunnel Worker replicas.'
      type: number
      default: '2'
      required: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-config
  labels:
    app: ${{ defaults.app_name }}-config
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-config
data:
  vn-optvn-seatunnelvn-configvn-hazelcastvn-mastervn-yaml: |
    hazelcast:
      cluster-name: ${{ defaults.app_name }}
      network:
        rest-api:
          enabled: true
          endpoint-groups:
            CLUSTER_WRITE:
              enabled: true
            DATA:
              enabled: true
        join:
          multicast:
            enabled: false
          kubernetes:
            enabled: true
            service-dns: ${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            service-port: 5801
          tcp-ip:
            enabled: false
        port:
          auto-increment: false
          port: 5801
      properties:
        hazelcast.invocation.max.retry.count: 20
        hazelcast.tcp.join.port.try.count: 30
        hazelcast.logging.type: log4j2
        hazelcast.operation.generic.thread.count: 50
        hazelcast.heartbeat.failuredetector.type: phi-accrual
        hazelcast.heartbeat.interval.seconds: 2
        hazelcast.max.no.heartbeat.seconds: 180
        hazelcast.heartbeat.phiaccrual.failuredetector.threshold: 10
        hazelcast.heartbeat.phiaccrual.failuredetector.sample.size: 200
        hazelcast.heartbeat.phiaccrual.failuredetector.min.std.dev.millis: 100
  vn-optvn-seatunnelvn-configvn-hazelcastvn-workervn-yaml: |
    hazelcast:
      cluster-name: ${{ defaults.app_name }}
      network:
        rest-api:
          enabled: true
          endpoint-groups:
            CLUSTER_WRITE:
              enabled: true
            DATA:
              enabled: true
        join:
          multicast:
            enabled: false
          kubernetes:
            enabled: true
            service-dns: ${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local
            service-port: 5801
          tcp-ip:
            enabled: false
        port:
          auto-increment: false
          port: 5801
      properties:
        hazelcast.invocation.max.retry.count: 20
        hazelcast.tcp.join.port.try.count: 30
        hazelcast.logging.type: log4j2
        hazelcast.operation.generic.thread.count: 50
        hazelcast.heartbeat.failuredetector.type: phi-accrual
        hazelcast.heartbeat.interval.seconds: 2
        hazelcast.max.no.heartbeat.seconds: 180
        hazelcast.heartbeat.phiaccrual.failuredetector.threshold: 10
        hazelcast.heartbeat.phiaccrual.failuredetector.sample.size: 200
        hazelcast.heartbeat.phiaccrual.failuredetector.min.std.dev.millis: 100
      member-attributes:
        rule:
          type: string
          value: worker
  vn-optvn-seatunnelvn-configvn-hazelcastvn-clientvn-yaml: |
    hazelcast-client:
      cluster-name: ${{ defaults.app_name }}
      properties:
        hazelcast.logging.type: log4j2
      connection-strategy:
        connection-retry:
          cluster-connect-timeout-millis: 3000
      network:
        cluster-members:
          - ${{ defaults.app_name }}.${{ SEALOS_NAMESPACE }}.svc.cluster.local:5801
  vn-optvn-seatunnelvn-configvn-seatunnelvn-yaml: |
    seatunnel:
      engine:
        history-job-expire-minutes: 1440
        backup-count: 1
        queue-type: blockingqueue
        print-execution-info-interval: 60
        print-job-metrics-info-interval: 60
        classloader-cache-mode: true
        slot-service:
          dynamic-slot: true
        http:
          enable-http: true
          port: 8080
          enable-dynamic-port: false
          port-range: 100
        checkpoint:
          interval: 300000
          timeout: 10000
          storage:
            type: hdfs
            max-retained: 3
            plugin-config:
              namespace: /opt/seatunnel/checkpoint/checkpoint_snapshot/
              storage.type: hdfs
              fs.defaultFS: file:///opt/seatunnel/checkpoint/
        telemetry:
          metric:
            enabled: true
  vn-optvn-seatunnelvn-configvn-jvmvn-mastervn-options: |
    -Xms256m
    -Xmx512m
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/opt/seatunnel/checkpoint/dump/zeta-server
    -XX:MaxMetaspaceSize=512m
    -XX:+UseG1GC
  vn-optvn-seatunnelvn-configvn-jvmvn-workervn-options: |
    -Xms256m
    -Xmx512m
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/opt/seatunnel/checkpoint/dump/zeta-server
    -XX:MaxMetaspaceSize=512m
    -XX:+UseG1GC
  vn-optvn-seatunnelvn-configvn-jvmvn-clientvn-options: |
    -Xms256m
    -Xmx512m
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/opt/seatunnel/checkpoint/dump/zeta-client

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-master
  annotations:
    originImageName: apache/seatunnel:2.3.13
    deploy.cloud.sealos.io/minReplicas: '2'
    deploy.cloud.sealos.io/maxReplicas: '2'
  labels:
    app: ${{ defaults.app_name }}-master
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-master
spec:
  replicas: 2
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-master
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-master
        seatunnel.apache.org/cluster: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: ${{ defaults.app_name }}-master
          image: apache/seatunnel:2.3.13
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /opt/seatunnel/checkpoint /opt/seatunnel/config
              cp /mounted-conf/vn-optvn-seatunnelvn-configvn-hazelcastvn-mastervn-yaml /opt/seatunnel/config/hazelcast-master.yaml
              cp /mounted-conf/vn-optvn-seatunnelvn-configvn-hazelcastvn-workervn-yaml /opt/seatunnel/config/hazelcast-worker.yaml
              cp /mounted-conf/vn-optvn-seatunnelvn-configvn-hazelcastvn-clientvn-yaml /opt/seatunnel/config/hazelcast-client.yaml
              cp /mounted-conf/vn-optvn-seatunnelvn-configvn-seatunnelvn-yaml /opt/seatunnel/config/seatunnel.yaml
              cp /mounted-conf/vn-optvn-seatunnelvn-configvn-jvmvn-mastervn-options /opt/seatunnel/config/jvm_master_options
              cp /mounted-conf/vn-optvn-seatunnelvn-configvn-jvmvn-workervn-options /opt/seatunnel/config/jvm_worker_options
              cp /mounted-conf/vn-optvn-seatunnelvn-configvn-jvmvn-clientvn-options /opt/seatunnel/config/jvm_client_options
              exec /opt/seatunnel/bin/seatunnel-cluster.sh -r master
          env:
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: hazelcast-port
              containerPort: 5801
              protocol: TCP
            - name: master-port
              containerPort: 8080
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 5801
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 5801
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5801
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: vn-mountedvn-conf
              mountPath: /mounted-conf
            - name: vn-optvn-seatunnelvn-checkpoint
              mountPath: /opt/seatunnel/checkpoint
      volumes:
        - name: vn-mountedvn-conf
          configMap:
            name: ${{ defaults.app_name }}-config
  volumeClaimTemplates:
    - metadata:
        name: vn-optvn-seatunnelvn-checkpoint
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-worker
  annotations:
    originImageName: apache/seatunnel:2.3.13
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '${{ inputs.worker_replicas }}'
  labels:
    app: ${{ defaults.app_name }}-worker
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-worker
spec:
  replicas: ${{ inputs.worker_replicas }}
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-worker
  template:
