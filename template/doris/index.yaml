---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-be
  labels:
    app: ${{ defaults.app_name }}-be
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-be
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: webui
      port: 8040
      targetPort: 8040
      protocol: TCP
    - name: heartbeat
      port: 9050
      targetPort: 9050
      protocol: TCP
    - name: brpc
      port: 8060
      targetPort: 8060
      protocol: TCP
    - name: rpc
      port: 9060
      targetPort: 9060
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}-be

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-register-be
  labels:
    app: ${{ defaults.app_name }}-register-be
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-register-be
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-register-be
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: register-be
          image: quay-kufddygt.sealoshzh.site/u-002/doris:4.1.0-fe
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              set -e
              fe_host="${DORIS_FE_SERVICE}.${DORIS_NAMESPACE}.svc.cluster.local"
              be_host="${DORIS_BE_POD}.${DORIS_BE_SERVICE}.${DORIS_NAMESPACE}.svc.cluster.local"
              until mysql -h"${fe_host}" -P9030 -uroot -e 'SHOW FRONTENDS;' >/dev/null 2>&1; do
                echo waiting for Doris FE
                sleep 5
              done
              until (echo >"/dev/tcp/${be_host}/9050") >/dev/null 2>&1; do
                echo waiting for Doris BE
                sleep 5
              done
              if mysql -h"${fe_host}" -P9030 -uroot -N -B -e 'SHOW BACKENDS;' | awk -v host="${be_host}" '$2 == host && $3 == "9050" { found = 1 } END { exit(found ? 0 : 1) }'; then
                echo Doris BE is already registered
              else
                mysql -h"${fe_host}" -P9030 -uroot -e "ALTER SYSTEM ADD BACKEND \"${be_host}:9050\";"
              fi
          env:
            - name: DORIS_NAMESPACE
              value: ${{ SEALOS_NAMESPACE }}
            - name: DORIS_FE_SERVICE
              value: ${{ defaults.app_name }}-fe
            - name: DORIS_BE_SERVICE
              value: ${{ defaults.app_name }}-be
            - name: DORIS_BE_POD
              value: ${{ defaults.app_name }}-be-0

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}-fe
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-fe
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}-fe
                port:
                  number: 8030
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/doris/logo.png'
  name: Apache Doris
  type: iframe
