apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: funasr
spec:
  title: 'FunASR'
  url: 'https://github.com/modelscope/FunASR'
  gitRepo: 'https://github.com/modelscope/FunASR'
  author: 'Sealos'
  description: 'FunASR is an open-source speech recognition toolkit from ModelScope. This template runs a CPU OpenAI-compatible transcription API with the SenseVoice model and persistent model cache.'
  readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/funasr/README.md'
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/funasr/logo.svg'
  templateType: inline
  locale: en
  i18n:
    zh:
      description: 'FunASR 是 ModelScope 开源语音识别工具包。本模板运行 CPU 版 SenseVoice 模型，并提供兼容 OpenAI 的转录 API 和持久化模型缓存。'
      readme: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/funasr/README_zh.md'
  categories:
    - ai
    - tool
  defaults:
    app_name:
      type: string
      value: funasr-${{ random(8) }}
    app_host:
      type: string
      value: funasr-${{ random(8) }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: crpi-wsxiy5y9ovijxdks.cn-hangzhou.personal.cr.aliyuncs.com/jockey/sealos-tools:funasr-api-0.1.1
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    app: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  serviceName: ${{ defaults.app_name }}
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ${{ defaults.app_name }}
          image: crpi-wsxiy5y9ovijxdks.cn-hangzhou.personal.cr.aliyuncs.com/jockey/sealos-tools:funasr-api-0.1.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - python server.py --host 0.0.0.0 --port ${FUNASR_PORT:-8000} --device ${FUNASR_DEVICE:-cpu} --model ${FUNASR_MODEL:-sensevoice}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: PYTHONUNBUFFERED
              value: '1'
            - name: PIP_NO_CACHE_DIR
              value: '1'
            - name: FUNASR_MODEL
              value: sensevoice
            - name: FUNASR_DEVICE
              value: cpu
            - name: FUNASR_PORT
              value: '8000'
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
          volumeMounts:
            - name: vn-rootvn-cache
              mountPath: /root/.cache
  volumeClaimTemplates:
    - metadata:
        annotations:
          path: /root/.cache
          value: '1'
        name: vn-rootvn-cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: ${{ defaults.app_name }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 1m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '1800'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '1800'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* \.(js|css|gif|jpe?g|png)) {
        expires 30d;
        add_header Cache-Control "public";
      }
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8000
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}

---
apiVersion: app.sealos.io/v1
kind: App
metadata:
  name: ${{ defaults.app_name }}
  labels:
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
spec:
  data:
    url: https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}/docs
  displayType: normal
  icon: 'https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/funasr/logo.svg'
  name: 'FunASR'
  type: link
