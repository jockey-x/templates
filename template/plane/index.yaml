apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: plane
spec:
  title: "Plane"
  url: "https://plane.so/"
  gitRepo: "https://github.com/makeplane/plane"
  author: "Sealos"
  description: "An open source project management platform for issues, cycles, modules, roadmaps, and product planning."
  readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/plane/README.md"
  icon: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/plane/logo.png"
  templateType: inline
  locale: en
  i18n:
    zh:
      description: "Plane 是一个开源项目管理平台，支持问题跟踪、周期、模块、路线图和产品规划。"
      readme: "https://raw.githubusercontent.com/labring-actions/templates/kb-0.9/template/plane/README_zh.md"
  categories:
    - dev-ops
    - tool
  defaults:
    app_name:
      type: string
      value: plane-${{ random(8) }}
    app_host:
      type: string
      value: plane-${{ random(8) }}
    secret_key:
      type: string
      value: ${{ random(50) }}
    live_server_secret_key:
      type: string
      value: ${{ random(32) }}
    rabbitmq_password:
      type: string
      value: ${{ random(32) }}
  inputs:

---
apiVersion: objectstorage.sealos.io/v1
kind: ObjectStorageBucket
metadata:
  name: ${{ defaults.app_name }}-private
spec:
  policy: private

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-pg
    app.kubernetes.io/instance: ${{ defaults.app_name }}-pg
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-pg
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-pg

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-pg
  labels:
    kb.io/database: postgresql-14.8.0
    clusterdefinition.kubeblocks.io/name: postgresql
    clusterversion.kubeblocks.io/name: postgresql-14.8.0
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
  clusterDefinitionRef: postgresql
  clusterVersionRef: postgresql-14.8.0
  componentSpecs:
    - componentDefRef: postgresql
      disableExporter: true
      enabledLogs:
        - running
      name: postgresql
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 25Mi
      serviceAccountName: ${{ defaults.app_name }}-pg
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
  terminationPolicy: Delete

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-pg-init
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              PG_SERVICE="${{ defaults.app_name }}-pg-postgresql.${{ SEALOS_NAMESPACE }}.svc"
              for i in $(seq 1 180); do
                if [ -s /var/run/sealos-postgres/password ] && pg_isready -h "${PG_SERVICE}" -p 5432 >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 2
              done
              test -s /var/run/sealos-postgres/password
              pg_isready -h "${PG_SERVICE}" -p 5432
          volumeMounts:
            - name: pg-conn-credential
              mountPath: /var/run/sealos-postgres
              readOnly: true
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      volumes:
        - name: pg-conn-credential
          secret:
            secretName: ${{ defaults.app_name }}-pg-conn-credential
            optional: true
      containers:
        - name: pgsql-init
          image: postgres:14-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: PG_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: endpoint
            - name: PG_DATABASE
              value: plane
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for i in $(seq 1 60); do
                if pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U "${PG_USERNAME}" -d postgres >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              pg_isready -h "${PG_ENDPOINT%:*}" -p "${PG_ENDPOINT##*:}" -U "${PG_USERNAME}" -d postgres >/dev/null 2>&1
              if ! psql "postgresql://${PG_USERNAME}:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -tAc "SELECT 1 FROM pg_database WHERE datname='plane'" | grep -q 1; then
                psql "postgresql://${PG_USERNAME}:${PG_PASSWORD}@${PG_ENDPOINT}/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"plane\";"
              fi
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    sealos-db-provider-cr: ${{ defaults.app_name }}-redis
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/managed-by: kbcli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${{ defaults.app_name }}-redis
subjects:
  - kind: ServiceAccount
    name: ${{ defaults.app_name }}-redis

---
apiVersion: apps.kubeblocks.io/v1alpha1
kind: Cluster
metadata:
  name: ${{ defaults.app_name }}-redis
  labels:
    kb.io/database: redis-7.0.6
    app.kubernetes.io/instance: ${{ defaults.app_name }}-redis
    app.kubernetes.io/version: 7.0.6
    clusterversion.kubeblocks.io/name: redis-7.0.6
    clusterdefinition.kubeblocks.io/name: redis
spec:
  affinity:
    podAntiAffinity: Preferred
    tenancy: SharedNode
    topologyKeys:
      - kubernetes.io/hostname
  clusterDefinitionRef: redis
  clusterVersionRef: redis-7.0.6
  componentSpecs:
    - componentDefRef: redis
      name: redis
      replicas: 1
      enabledLogs:
        - running
      env:
        - name: CUSTOM_SENTINEL_MASTER_NAME
          value: ""
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 25Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.0.6
      switchPolicy:
        type: Noop
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: openebs-backup
    - componentDefRef: redis-sentinel
      name: redis-sentinel
      replicas: 1
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 25Mi
      serviceAccountName: ${{ defaults.app_name }}-redis
      serviceVersion: 7.0.6
      volumeClaimTemplates:
        - name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
  terminationPolicy: Delete
  topology: replication

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-app-vars
  labels:
    app: ${{ defaults.app_name }}-app-vars
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-app-vars
data:
  API_KEY_RATE_LIMIT: "60/minute"
  AWS_REGION: "us-east-1"
  CORS_ALLOWED_ORIGINS: "http://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }},https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"
  DEBUG: "0"
  DOCKERIZED: "1"
  FILE_SIZE_LIMIT: "5242880"
  GUNICORN_WORKERS: "1"
  MINIO_ENDPOINT_SSL: "0"
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: ""
  SIGNED_URL_EXPIRATION: "3600"
  USE_MINIO: "0"
  WEB_URL: "https://${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${{ defaults.app_name }}-live-vars
  labels:
    app: ${{ defaults.app_name }}-live-vars
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-live-vars
data:
  API_BASE_URL: "http://${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc:8000/"
  LIVE_BASE_PATH: "/live"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${{ defaults.app_name }}-mq
  annotations:
    originImageName: rabbitmq:3.13.6-management-alpine
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-mq
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mq
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-mq
  serviceName: ${{ defaults.app_name }}-mq
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-mq
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: ${{ defaults.app_name }}-mq
          image: rabbitmq:3.13.6-management-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: plane
            - name: RABBITMQ_DEFAULT_PASS
              value: "${{ defaults.rabbitmq_password }}"
            - name: RABBITMQ_DEFAULT_VHOST
              value: /
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: 5672
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: vn-varvn-libvn-rabbitmq
              mountPath: /var/lib/rabbitmq
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
  volumeClaimTemplates:
    - metadata:
        name: vn-varvn-libvn-rabbitmq
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: openebs-backup

---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-mq
  labels:
    app: ${{ defaults.app_name }}-mq
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-mq
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app: ${{ defaults.app_name }}-mq

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${{ defaults.app_name }}-api-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-plane-deps
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              PG_SERVICE="${{ defaults.app_name }}-pg-postgresql.${{ SEALOS_NAMESPACE }}.svc"
              REDIS_SERVICE="${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc"
              MQ_SERVICE="${{ defaults.app_name }}-mq.${{ SEALOS_NAMESPACE }}.svc"
              for i in $(seq 1 180); do
                if nc -z -w 2 "${PG_SERVICE}" 5432 \
                  && nc -z -w 2 "${REDIS_SERVICE}" 6379 \
                  && nc -z -w 2 "${MQ_SERVICE}" 5672; then
                  exit 0
                fi
                sleep 2
              done
              nc -z -w 2 "${PG_SERVICE}" 5432
              nc -z -w 2 "${REDIS_SERVICE}" 6379
              nc -z -w 2 "${MQ_SERVICE}" 5672
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}-api-migrate
          image: artifacts.plane.so/makeplane/plane-backend:v1.3.1
          imagePullPolicy: IfNotPresent
          command:
            - ./bin/docker-entrypoint-migrator.sh
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-app-vars
                optional: false
          env:
            - name: SECRET_KEY
              value: "${{ defaults.secret_key }}"
            - name: LIVE_SERVER_SECRET_KEY
              value: "${{ defaults.live_server_secret_key }}"
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: port
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-pg-conn-credential
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(PG_USERNAME):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/plane"
            - name: REDIS_HOST
              value: "${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-conn-credential
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/"
            - name: AMQP_URL
              value: "amqp://plane:${{ defaults.rabbitmq_password }}@${{ defaults.app_name }}-mq.${{ SEALOS_NAMESPACE }}.svc:5672/"
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: accessKey
            - name: AWS_ACCESS_KEY_ID
              value: "$(S3_ACCESS_KEY_ID)"
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: secretKey
            - name: AWS_SECRET_ACCESS_KEY
              value: "$(S3_SECRET_ACCESS_KEY)"
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: object-storage-key-${{ SEALOS_SERVICE_ACCOUNT }}-${{ defaults.app_name }}-private
                  key: bucket
            - name: AWS_S3_BUCKET_NAME
              value: "$(S3_BUCKET)"
            - name: BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: object-storage-key
                  key: external
            - name: AWS_S3_ENDPOINT_URL
              value: "https://$(BACKEND_STORAGE_MINIO_EXTERNAL_ENDPOINT)"
          resources:
            limits:
              cpu: 500m
              memory: 1000Mi
            requests:
              cpu: 50m
              memory: 50Mi
      restartPolicy: OnFailure
  ttlSecondsAfterFinished: 300

---
