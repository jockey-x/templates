---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}-api
  labels:
    app: ${{ defaults.app_name }}-api
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-api
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app: ${{ defaults.app_name }}-api

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-worker
  annotations:
    originImageName: artifacts.plane.so/makeplane/plane-backend:v1.3.1
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-worker
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-worker
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-worker
  strategy:
