apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}-live
  annotations:
    originImageName: artifacts.plane.so/makeplane/plane-live:v1.3.1
    deploy.cloud.sealos.io/minReplicas: "1"
    deploy.cloud.sealos.io/maxReplicas: "1"
  labels:
    app: ${{ defaults.app_name }}-live
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}-live
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}-live
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}-live
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-live-deps
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              REDIS_SERVICE="${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc"
              API_SERVICE="${{ defaults.app_name }}-api.${{ SEALOS_NAMESPACE }}.svc"
              for i in $(seq 1 180); do
                if nc -z -w 2 "${REDIS_SERVICE}" 6379 \
                  && nc -z -w 2 "${API_SERVICE}" 8000; then
                  exit 0
                fi
                sleep 2
              done
              nc -z -w 2 "${REDIS_SERVICE}" 6379
              nc -z -w 2 "${API_SERVICE}" 8000
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 25Mi
      containers:
        - name: ${{ defaults.app_name }}-live
          image: artifacts.plane.so/makeplane/plane-live:v1.3.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ${{ defaults.app_name }}-live-vars
                optional: false
          env:
            - name: LIVE_SERVER_SECRET_KEY
              value: "${{ defaults.live_server_secret_key }}"
            - name: REDIS_HOST
              value: "${{ defaults.app_name }}-redis-redis.${{ SEALOS_NAMESPACE }}.svc"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ${{ defaults.app_name }}-redis-conn-credential
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: 3000
            failureThreshold: 30
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 1000Mi
            requests:
              cpu: 50m
              memory: 50Mi

